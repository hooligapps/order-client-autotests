x-playwright-common: &playwright-common
  image: order-client-autotests:local
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  env_file:
    - .env
  environment:
    CI: ${CI:-0}
    PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-1}
    AUTOTEST_ENV: ${AUTOTEST_ENV:-dev}
  volumes:
    - ./playwright-report:/app/playwright-report
    - ./test-results:/app/test-results

services:
  playwright:
    <<: *playwright-common
    command: ["npx", "playwright", "test"]

  bootstrap:
    <<: *playwright-common
    command: ["npx", "playwright", "test", "--grep", "@bootstrap"]

  tutor:
    <<: *playwright-common
    command: ["npx", "playwright", "test", "--grep", "@tutor"]

  tutor-full:
    <<: *playwright-common
    command: ["npx", "playwright", "test", "--grep", "@full"]

  dev:
    <<: *playwright-common
    profiles: ["dev"]
    environment:
      CI: ${CI:-0}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-1}
      AUTOTEST_ENV: dev
    command: ["npx", "playwright", "test"]

  dev-tutor:
    <<: *playwright-common
    profiles: ["dev"]
    environment:
      CI: ${CI:-0}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-1}
      AUTOTEST_ENV: dev
    command: ["npx", "playwright", "test", "--grep", "@tutor"]

  dev-tutor-walkthrough:
    <<: *playwright-common
    profiles: ["dev"]
    environment:
      CI: ${CI:-0}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-1}
      AUTOTEST_ENV: dev
    command: ["npx", "playwright", "test", "--grep", "tutor walkthrough"]

  prod:
    <<: *playwright-common
    profiles: ["prod"]
    environment:
      CI: ${CI:-0}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-1}
      AUTOTEST_ENV: prod
    command: ["npx", "playwright", "test", "--grep", "@prod-safe"]
